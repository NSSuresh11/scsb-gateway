buildscript {
	ext {
		springBootVersion = '4.0.7'
		set('springCloudVersion', "2025.1.2")
	}
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
	}
}

plugins {
	id "org.sonarqube" version "6.3.1.5724"
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springframework.boot' version '4.0.7'
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'org.springframework.boot'
apply plugin: 'jacoco'

//added to accept systemproperties while executing gradlew test cmd
test {
	systemProperties = System.properties
	useJUnitPlatform()
}

jar {
	archiveBaseName = 'scsb-gateway'
	archiveVersion = '0.0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
	mavenCentral()
}

dependencies {

	implementation fileTree(dir: '/data/commonjar', include: '*3.2.jar')
	implementation('org.springframework.boot:spring-boot-starter-webservices')
	implementation('org.springframework.boot:spring-boot-starter-data-jpa')
	implementation('commons-beanutils:commons-beanutils:1.11.0')
    implementation('org.apache.commons:commons-lang3:3.20.0')
	implementation('org.codehaus.jettison:jettison:1.5.7')
	implementation('org.springframework.boot:spring-boot-starter-thymeleaf')
	implementation('org.apache.camel:camel-api:4.18.4')
	implementation('org.apache.camel:camel-bindy:4.18.4')
	implementation('org.apache.camel.springboot:camel-spring-boot-starter:4.18.4')
	implementation('org.apache.camel:camel-activemq:4.18.4')
	implementation 'org.apache.camel:camel-jms:4.18.4'
	implementation('org.apache.camel:camel-ftp:4.18.4')
	implementation('org.apache.camel:camel-csv:4.18.4')
	implementation('info.freelibrary:freelib-marc4j:2.6.12')
	testImplementation 'org.apache.camel:camel-jetty:4.18.4'
	implementation('org.apache.solr:solr-solrj:9.10.1')
	implementation('org.apache.activemq:activemq-pool:6.2.9')
	implementation('org.apache.activemq:activemq-broker:6.2.9')
    implementation('org.apache.activemq:activemq-client:6.2.9')
    implementation('org.apache.tomcat.embed:tomcat-embed-core:11.0.25')
    implementation('org.apache.tomcat.embed:tomcat-embed-el:11.0.25')
    implementation('org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25')
    implementation('org.apache.tomcat:tomcat-annotations-api:11.0.25')
    implementation('org.projectlombok:lombok:1.18.46')
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation('org.springframework.boot:spring-boot-starter-webmvc')
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
	implementation 'io.zipkin.brave:brave:6.3.1'

	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-bus-amqp'
    implementation 'org.json:json:20260719'
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'
    testImplementation 'org.powermock:powermock-module-junit4:2.0.9'

    annotationProcessor('org.projectlombok:lombok:1.18.46')
	testImplementation('org.projectlombok:lombok:1.18.46')
	testAnnotationProcessor('org.projectlombok:lombok:1.18.46')
	implementation 'com.mysql:mysql-connector-j:9.1.0'
	testImplementation('org.springframework.boot:spring-boot-starter-test')

	implementation 'org.springframework.cloud:spring-cloud-starter-sleuth:3.1.11'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

}

configurations.all {
	resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.group == 'org.apache.logging.log4j') {
			details.useVersion '2.26.1'
		}
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}
jacocoTestReport {
	dependsOn test // tests are required to run before generating the report
}

jacocoTestReport {
	reports {
		xml.required = true
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
	}
}

jacoco {
	toolVersion = "0.8.14"
	reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

task scsbJavadocs(type: Javadoc) {
	source = sourceSets.main.java
	classpath = configurations.implementation
	options.addStringOption('Xdoclint:none', '-quiet')
	String home = System.getProperty("user.home");
	destinationDir =  new File(home+"/scsb-javadocs/scsb");

}
/*
bootJar {
	layered()
} */

jar {
	enabled = false
	archiveClassifier = '' //use empty string
}

tasks.named('bootJar') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
